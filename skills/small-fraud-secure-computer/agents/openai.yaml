interface:
  display_name: "소액사기 보안 Computer Use"
  short_description: "로컬 마스킹 관찰로 공식 포털 탐색만 보조합니다. 인증·결제·최종 제출은 사용자가 직접 수행합니다."
  default_prompt: "마스킹된 관찰만 근거로 다음 한 단계만 진행하고, 인증·법적 진술·결제·최종 제출 직전에 멈추어 사용자에게 넘기세요."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: mcp
      value: haksulsomoim-local
      description: "Locally redacts observations, restores tokens only inside allowlisted browser fields, and executes only digest-bound allowlisted actions."
    - type: mcp
      value: korean-law
      description: "Verifies statute and court-rule citations against official Korean law sources before they are stated."
