<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>LLM Wiki란 무엇인가</title>
  <link rel="stylesheet" href="./shared.css">
</head>
<body>
  <p class="eyebrow">개념</p>
  <h2>LLM이 근거를 찾고,<br>연결하고, 설명하는 Wiki</h2>
  <div class="grid-3" style="margin-top: 54px;">
    <div class="card">
      <div class="number">읽기</div>
      <h3 style="margin-top: 28px;">자료를 구조화</h3>
      <p>법령, 판례, 공공기관 안내, 사례 기록을 주제별로 정리합니다.</p>
    </div>
    <div class="card">
      <div class="number">연결</div>
      <h3 style="margin-top: 28px;">주장과 출처를 연결</h3>
      <p>문장마다 어떤 원문과 검증 기록을 사용했는지 추적합니다.</p>
    </div>
    <div class="card dark-card">
      <div class="number" style="color:#2997ff;">설명</div>
      <h3 style="margin-top: 28px;">질문에 맞춰 검색</h3>
      <p>사건 단계에 맞는 절차와 근거를 찾아 이해하기 쉽게 제시합니다.</p>
    </div>
  </div>
  <p class="page">02</p>
</body>
</html>
