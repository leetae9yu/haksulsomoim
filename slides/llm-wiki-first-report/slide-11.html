<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>원천자료 자동 컴파일</title>
  <link rel="stylesheet" href="./shared.css">
</head>
<body>
  <p class="eyebrow">원천자료 입력</p>
  <h2 style="font-size:46px;line-height:1.2;padding-bottom:18px;">URL·PDF·Markdown에서<br>Wiki 초안을 자동 생성</h2>
  <div class="flow" style="margin-top:62px;">
    <div class="node">
      <span class="code">입력</span>
      <strong>원천자료</strong>
      <span>로컬 PDF·Markdown<br>URL 참조</span>
    </div>
    <span class="arrow">→</span>
    <div class="node">
      <span class="code">정리</span>
      <strong>정리·마스킹</strong>
      <span>텍스트 추출·변경 확인<br>개인정보 마스킹·중복 표시</span>
    </div>
    <span class="arrow">→</span>
    <div class="node">
      <span class="code">초안</span>
      <strong>근거 초안</strong>
      <span>출처·관찰·주장<br>관찰됨 / 초안</span>
    </div>
    <span class="arrow">→</span>
    <div class="node" style="border-color:#0071e3;">
      <span class="code">검증</span>
      <strong>Wiki 검증</strong>
      <span>구조·근거·링크<br>자동 검사</span>
    </div>
  </div>
  <div style="margin-top:44px;display:flex;gap:14px;align-items:center;">
    <span class="pill">대량 입력</span>
    <span class="pill gray">같은 입력, 같은 결과</span>
    <span class="pill gray">기존 파일 보호</span>
  </div>
  <p class="page">11</p>
</body>
</html>
