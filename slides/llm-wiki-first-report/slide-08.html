<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>출처 충돌 처리</title>
  <link rel="stylesheet" href="./shared.css">
</head>
<body class="dark">
  <p class="eyebrow">충돌 처리</p>
  <h2>공식 자료 안에서도<br>의미가 충돌할 수 있습니다</h2>
  <div class="two-col" style="margin-top:44px;">
    <div class="card dark-card" style="min-height:360px;border-color:#3a3a3c;">
      <span class="pill gray">공식 설명</span>
      <p style="margin-top:30px;color:#fff;font-size:30px;font-weight:700;">“2024년 전체 발생건수<br>100,539건”</p>
      <p>공공데이터 포털 설명문</p>
    </div>
    <div class="card dark-card" style="min-height:360px;border-color:#3a3a3c;">
      <span class="pill gray">공식 표</span>
      <p style="margin-top:30px;color:#fff;font-size:30px;font-weight:700;">“직거래 열<br>100,539건”</p>
      <p>같은 데이터셋의 표 구조</p>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:18px;width:calc(100% - 120px);margin-top:26px;">
    <span class="pill red">게시 보류</span>
    <p style="font-size:23px;color:#d2d2d7;">정의 충돌을 기록하고, 확정 통계로 게시하지 않았습니다.</p>
  </div>
  <p class="page">08</p>
</body>
</html>
