<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Wiki를 구성한 자료</title>
  <link rel="stylesheet" href="./shared.css">
</head>
<body class="soft">
  <p class="eyebrow">자료 구성</p>
  <h2>Wiki를 구성한 네 가지 자료군</h2>
  <div class="grid-4" style="margin-top: 50px;">
    <div class="stage" style="background:#fff;">
      <div>
        <span class="stage-index">01</span>
        <h3>법령·판례</h3>
      </div>
      <ul>
        <li>형법·민사소송법</li>
        <li>민사집행법</li>
        <li>대법원 판례</li>
      </ul>
    </div>
    <div class="stage" style="background:#fff;">
      <div>
        <span class="stage-index">02</span>
        <h3>공공기관 안내</h3>
      </div>
      <ul>
        <li>경찰·검찰</li>
        <li>법원·전자소송</li>
        <li>소비자·통계 포털</li>
      </ul>
    </div>
    <div class="stage" style="background:#fff;">
      <div>
        <span class="stage-index">03</span>
        <h3>사례 자료</h3>
      </div>
      <ul>
        <li>판례형 P 노트</li>
        <li>사례형 R 노트</li>
        <li>절차별 사건 흐름</li>
      </ul>
    </div>
    <div class="stage dark-card" style="background:#1d1d1f;">
      <div>
        <span class="stage-index" style="color:#2997ff;">04</span>
        <h3 style="color:#fff;">연구 기록</h3>
      </div>
      <ul>
        <li style="color:#a1a1a6;">검색·반대 근거</li>
        <li style="color:#a1a1a6;">충돌·공백 기록</li>
        <li style="color:#a1a1a6;">검증·포화도 기록</li>
      </ul>
    </div>
  </div>
  <p class="page">03</p>
</body>
</html>
