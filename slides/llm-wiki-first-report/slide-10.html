<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>자동 검증</title>
  <link rel="stylesheet" href="./shared.css">
</head>
<body class="soft">
  <p class="eyebrow">자동 검증</p>
  <h2>Wiki가 커져도 구조와 근거를<br>자동으로 검사</h2>
  <div class="check-list">
    <div class="check"><span class="check-mark">✓</span>문서 머리말과 파일 구조</div>
    <div class="check"><span class="check-mark">✓</span>깨진 링크와 존재하지 않는 ID</div>
    <div class="check"><span class="check-mark">✓</span>출처·관찰·주장 그래프</div>
    <div class="check"><span class="check-mark">✓</span>기준일·해시·중복 출처</div>
    <div class="check"><span class="check-mark">✓</span>개인정보와 원문 과다 복사</div>
    <div class="check"><span class="check-mark">✓</span>판결·확정·집행·회수 상태</div>
    <div class="check"><span class="check-mark">✓</span>통계 자격과 보고서 인용</div>
    <div class="check"><span class="check-mark">✓</span>검색 단계와 포화도 근거</div>
  </div>
  <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:38px;">
    <div>
      <div class="number">215</div>
      <p class="mini" style="margin-top:8px;">자동 테스트 통과</p>
    </div>
    <span class="pill green" style="font-size:20px;padding:10px 22px;">필수 검증 실패 0건</span>
  </div>
  <p class="page">10</p>
</body>
</html>
