<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>12개 연구 영역</title>
  <link rel="stylesheet" href="./shared.css">
</head>
<body>
  <p class="eyebrow">연구 범위</p>
  <h2>피해 발생부터 실제 회수까지<br>12개 영역으로 조사</h2>
  <div class="grid-4" style="margin-top: 44px;">
    <div class="stage">
      <div>
        <span class="stage-index">발생·증거</span>
        <h3>사기 판단과 자료 보존</h3>
      </div>
      <ul>
        <li>연구 범위</li>
        <li>사기 구성요건</li>
        <li>전자증거</li>
      </ul>
    </div>
    <div class="stage">
      <div>
        <span class="stage-index">형사</span>
        <h3>신고부터 형사재판</h3>
      </div>
      <ul>
        <li>경찰·검찰 절차</li>
        <li>피해자 참여</li>
        <li>배상명령</li>
      </ul>
    </div>
    <div class="stage">
      <div>
        <span class="stage-index">민사</span>
        <h3>소송과 판결 확정</h3>
      </div>
      <ul>
        <li>지급명령·소액사건</li>
        <li>송달·항소</li>
        <li>집행권원</li>
      </ul>
    </div>
    <div class="stage dark-card" style="background:#1d1d1f;">
      <div>
        <span class="stage-index" style="color:#2997ff;">회수·예방</span>
        <h3 style="color:#fff;">집행과 안전 경계</h3>
      </div>
      <ul>
        <li style="color:#a1a1a6;">압류·추심·회생</li>
        <li style="color:#a1a1a6;">결제·안전 서비스</li>
        <li style="color:#a1a1a6;">통계·개인정보</li>
      </ul>
    </div>
  </div>
  <p class="page">05</p>
</body>
</html>
