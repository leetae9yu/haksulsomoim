<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>리서치 포화도</title>
  <link rel="stylesheet" href="./shared.css">
</head>
<body>
  <p class="eyebrow">검색 포화도</p>
  <h2>정해진 연구 범위를<br>두 번 독립적으로 검색</h2>
  <div class="grid-3" style="margin-top:50px;">
    <div class="big-stat blue">
      <div class="value">107</div>
      <div class="label">절차·증거·집행·예방을 나눈 조사 셀</div>
    </div>
    <div class="big-stat">
      <div class="value">2×</div>
      <div class="label">서로 겹치지 않는 셀별 검색 단계</div>
    </div>
    <div class="big-stat">
      <div class="value">0</div>
      <div class="label">신규 핵심 후보와 남은 검토 후보</div>
    </div>
  </div>
  <div style="margin-top:34px;">
    <div class="timeline">
      <div class="timeline-item"><strong>질문 정의</strong><p>셀별 검색 목적</p></div>
      <div class="timeline-item"><strong>1차 검색</strong><p>107개 독립 검색</p></div>
      <div class="timeline-item"><strong>후보 검토</strong><p>중복·신규 판정</p></div>
      <div class="timeline-item"><strong>2차 검색</strong><p>107개 교차 검색</p></div>
      <div class="timeline-item"><strong>종료</strong><p>신규 후보 0 · 대기 0</p></div>
    </div>
  </div>
  <p class="page">09</p>
</body>
</html>
