<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>근거 상태</title>
  <link rel="stylesheet" href="./shared.css">
</head>
<body>
  <p class="eyebrow">근거 상태</p>
  <h2>확인 수준을 문장에 함께 표시</h2>
  <div class="grid-3" style="margin-top: 58px;">
    <div class="card" style="min-height:300px;">
      <span class="pill green">확인됨</span>
      <h3 style="margin-top:28px;">공식 근거 확인</h3>
      <p>현행 법령, 판례 전문, 공식 기관 안내로 직접 확인한 내용입니다.</p>
    </div>
    <div class="card" style="min-height:300px;">
      <span class="pill orange">관찰됨</span>
      <h3 style="margin-top:28px;">관찰·사례 기반</h3>
      <p>포털 관찰, 사례 기록, 기관 통계처럼 범위와 기준일을 함께 읽는 내용입니다.</p>
    </div>
    <div class="card dark-card" style="min-height:300px;">
      <span class="pill red">공백 / 게시 보류</span>
      <h3 style="margin-top:28px;">공백·충돌 보류</h3>
      <p>출처 접근이 어렵거나 의미가 충돌해 추가 확인이 필요한 내용입니다.</p>
    </div>
  </div>
  <p class="footer">답변은 주장 상태와 기준일을 함께 전달</p>
  <p class="page">07</p>
</body>
</html>
