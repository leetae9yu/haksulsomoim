appId: kr.co.haksulsomoim.smallfraud
productName: 소액사기 사건 코파일럿
copyright: Copyright © 2026 Haksul Somoim

directories:
  output: dist

files:
  - out/**/*
  - "!out/main/qa.js"
  - package.json
  - "!node_modules/**/test/**/*"
  - "!node_modules/**/tests/**/*"
  - "!node_modules/**/__tests__/**/*"
  - "!node_modules/**/*.test.*"
  - "!node_modules/**/*.spec.*"

asar: true
asarUnpack:
  - node_modules/**/*

npmRebuild: false
buildDependenciesFromSource: false

win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: haksulsomoim-small-fraud-agent
  artifactName: small-fraud-agent-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 소액사기 사건 코파일럿
  uninstallDisplayName: 소액사기 사건 코파일럿
  deleteAppDataOnUninstall: false
